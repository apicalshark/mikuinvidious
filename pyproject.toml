[project]
name = "mikuinvidious"
version = "0.1.0"
description = "A free and open-source frontend for Bilibili, inspired by Invidious."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.5",
    "aiohttp-socks>=0.11.0",
    "anyio>=4.13.0",
    "apscheduler>=3.11.2",
    "beautifulsoup4>=4.14.3",
    "brotli>=1.2.1",
    "httpx[socks,http2]>=0.28.1",
    "granian>=2.7.2",
    "jinja2>=3.1.6",
    "lxml>=6.0.2",
    "markupsafe>=3.0.3",
    "pysocks>=1.7.1",
    "quart>=0.20.0",
    "redis>=7.4.0",
    "uvloop>=0.22.1",
    "werkzeug>=3.1.7",
    "orjson>=3.11.8",
    "flask-orjson>=2.0.0",
    "pyquery>=2.0.1",
    "pynacl>=1.5.0",
    "curl-cffi>=0.16.1",
    "Babel>=2.17.0",
    "httpx-curl-cffi==0.1.5",
    "nh3>=0.3.7",
    "rtoml>=0.14.0",
    "zhconv-rs>=0.4.2",
    "gtlv>=0.1.4",
]

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter / long URLs/UAs)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.djlint]
profile = "jinja"
indent = 4
preserve_blank_lines = true
close_void_tags = true
format_js = false
format_css = true

[dependency-groups]
dev = [
    "djlint>=1.47.1",
    "ruff>=0.17.3",
]
