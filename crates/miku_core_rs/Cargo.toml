[package]
name = "miku_core_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "miku_core_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py315", "extension-module"] }
quick-xml = "0.42"
md-5 = "0.11"
html-escape = "0.2"
brotli = "9.1"
serde_json = "1.0"
url = "2.5"
regex = "1.11"
byteorder = "1.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
