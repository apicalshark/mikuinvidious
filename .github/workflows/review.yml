name: Security audit

on:
  push:
    branches: [main, master, ng, stable]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Export frozen requirements from uv.lock
        run: uv export --frozen --no-dev --no-emit-project -o /tmp/requirements-frozen.txt

      - name: Install pip-audit
        run: pip install --no-cache-dir pip-audit

      - name: Audit locked dependencies
        run: pip-audit --disable-pip -r /tmp/requirements-frozen.txt --desc on

  npm-audit:
    name: npm audit (JS deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit for HIGH/CRITICAL
        run: npm audit --omit=dev --audit-level=high

      - name: Verify package integrity
        run: npm audit signatures

  bandit:
    name: bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run Bandit static security analysis
        run: uvx bandit -r python/miku -ll -ii -s B104,B413,B704

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan git history for leaked secrets
        run: docker run --rm -v "${{ github.workspace }}:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact /repo
