name: Build and push Docker image

on:
  # push:
  #   branches: [exp]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mikuinvidious

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: vars
        run: |
          DESC=$(git describe --tags --always --dirty 2>/dev/null || echo ${GITHUB_SHA::7})
          BRANCH="${{ github.ref_name }}"
          if [ -n "$BRANCH" ] && [ "${{ github.ref_type }}" != "tag" ]; then
            echo "version=${DESC} @ ${BRANCH}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${DESC}" >> "$GITHUB_OUTPUT"
          fi
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}
            GIT_COMMIT=${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
