services:
  app:
    build: .
    container_name: miku_app
    restart: always
    environment:
      - SITE_NAME=MikuInvidious
      - SITE_URL=http://localhost:8000
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - REDIS_URL=redis://redis:6379
      - SERVER_PORT=8080
      - PYTHONUNBUFFERED=1
      - SITE_MODIFIED_SOURCE_CODE_URL=https://github.com/apicalshark/mikuinvidious
      - USE_CRED=false
      # QUART_SECRET_KEY is auto-generated in python/shared.py at startup
      # Nyaa Search functionality
      - NYAA_BANGUMI=true
      # Bilibili Credentials (Optional)
      - SESSDATA=
      - BILI_JCT=
      - BUVID3=
      - BUVID4=
      - DEDEUSERID=
    depends_on:
      - redis

  caddy:
    image: caddy:alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    container_name: miku_caddy
    restart: always
    ports:
      - "8000:8000"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./static:/usr/share/caddy/static
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  redis:
    image: redis:alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    container_name: miku_redis
    restart: always

volumes:
  caddy_data:
  caddy_config:
