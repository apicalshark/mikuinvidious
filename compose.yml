services:
  app:
    build: .
    container_name: miku_app
    restart: always
    environment:
      - SITE_NAME=MikuInvidious
      - SITE_URL=http://localhost:8000
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - REDIS_URL=redis://redis:6379
      - SERVER_PORT=8080
      - PYTHONUNBUFFERED=1
      - SITE_MODIFIED_SOURCE_CODE_URL=https://github.com/apicalshark/mikuinvidious
      - USE_CRED=false
      - TRUSTED_PROXIES=127.0.0.1/8,::1/128,172.30.0.0/24
      # QUART_SECRET_KEY: when unset, an ephemeral key is generated in python/miku/core/app.py at startup.
      # Recommend setting QUART_SECRET_KEY in production so sessions and CSRF tokens survive restarts.
      # Nyaa Search functionality
      - NYAA_BANGUMI=true
      # Bilibili Credentials (Optional)
      - SESSDATA=
      - BILI_JCT=
      - BUVID3=
      - BUVID4=
      - DEDEUSERID=
    volumes:
      - img_cache:/app/data/img_cache
    depends_on:
      - redis
    networks:
      - miku_net

  caddy:
    image: caddy:alpine@sha256:f6228111e5fafa1a5238258d0858e103f10599b8d1659a146e7726681a002bb9
    container_name: miku_caddy
    restart: always
    ports:
      - "8000:8000"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./static:/usr/share/caddy/static
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - miku_net

  redis:
    image: redis:alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    container_name: miku_redis
    restart: always
    networks:
      - miku_net

networks:
  miku_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
  img_cache:
