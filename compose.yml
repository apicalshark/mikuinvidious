services:
  app:
    build: .
    container_name: miku_app
    restart: always
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    environment:
      - SITE_NAME=MikuInvidious
      - SITE_URL=http://localhost:8000
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - REDIS_URL=redis://:${REDIS_PASSWORD:-miku_change_me_redis_password}@redis:6379/0
      - SERVER_PORT=8080
      - PYTHONUNBUFFERED=1
      - SITE_MODIFIED_SOURCE_CODE_URL=https://github.com/apicalshark/mikuinvidious
      - USE_CRED=false
      - RATE_LIMIT_ENABLED=true
      - TRUSTED_PROXIES=127.0.0.1/8,::1/128,172.30.0.0/24
      - MAX_DOWNLOAD_SIZE_MB=512
      - MAX_DOWNLOAD_DISK_MB=1024
      - QUART_SECRET_KEY=${QUART_SECRET_KEY:-}
      # QUART_SECRET_KEY: when unset, an ephemeral key is generated in python/miku/core/app.py at startup.
      # Recommend setting QUART_SECRET_KEY in production so sessions and CSRF tokens survive restarts.
      # Nyaa Search functionality
      - NYAA_BANGUMI=true
      # Bilibili Credentials (Optional)
      - SESSDATA=
      - BILI_JCT=
      - BUVID3=
      - BUVID4=
      - DEDEUSERID=
    volumes:
      - img_cache:/app/data/img_cache
      - dl_tmp:/tmp
    depends_on:
      - redis
    networks:
      - miku_net

  caddy:
    image: caddy:alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    container_name: miku_caddy
    restart: always
    read_only: true
    tmpfs:
      - /tmp:size=16M
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 192m
    ports:
      - "8000:8000"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/usr/share/caddy/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - miku_net

  redis:
    image: redis:alpine@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
    container_name: miku_redis
    restart: always
    user: "999:999"
    read_only: true
    tmpfs:
      - /data:size=16M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 192m
    memswap_limit: 192m
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --lazyfree-lazy-eviction
      - "yes"
      - --lazyfree-lazy-expire
      - "yes"
      - --lazyfree-lazy-server-del
      - "yes"
      - --timeout
      - "60"
      - --tcp-keepalive
      - "30"
      - --requirepass
      - ${REDIS_PASSWORD:-miku_change_me_redis_password}
    networks:
      - miku_net

networks:
  miku_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
  img_cache:
  dl_tmp:
