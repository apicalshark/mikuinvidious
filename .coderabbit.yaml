# CodeRabbit configuration file
# Reference: https://coderabbit.ai/docs/configure-coderabbit
version: "2"
language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
  tools:
    ast-grep:
      enabled: true
    ruff:
      enabled: true

chat:
  auto_reply: true

instructions: |
  Repository context:
  - Language: Python 3.15+ with Quart (ASGI), Granian, and Caddy.
  - Rust core: crates/miku_core_rs/ using PyO3 0.30+ (abi3-py315) and quick-xml.
  - Architectural constraints:
    - Never recommend replacing Quart or Jinja2 with Litestar or MiniJinja (evaluated and rejected in issue #72).
    - Media proxying relies on raw-socket CdnConnection streaming with ProxyResponse and ClosingIterator to prevent descriptor leaks; preserve this intact.
    - Any native Rust functionality in crates/miku_core_rs/ MUST preserve pure-Python fallbacks.
    - Only npm run commands (npm test, npm run lint, npm run check:compile) are used for verification.
